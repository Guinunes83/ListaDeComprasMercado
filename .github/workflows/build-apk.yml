name: Build APK from Web App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare Web Assets in Dedicated Folder
        run: |
          # 1. Cria a pasta www exigida pelo Capacitor
          mkdir -p www_build

          # 2. Se houver build (dist/build), copia dela; senão, copia os arquivos da raiz
          if [ -d "dist" ]; then
            cp -r dist/* www_build/
          elif [ -d "build" ]; then
            cp -r build/* www_build/
          elif [ -d "public" ]; then
            cp -r public/* www_build/
          else
            # Copia todos os arquivos HTML, JS, CSS, imagens e pastas para www_build
            rsync -av --exclude='node_modules' --exclude='.git' --exclude='.github' --exclude='www_build' ./ www_build/
          fi

          # Garante que um package.json exista para o Capacitor
          if [ ! -f "package.json" ]; then
            npm init -y
          fi

      - name: Setup Android Wrapper (Capacitor)
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "ListaDeCompras" "com.app.listadecompras" --web-dir "www_build"
          npx cap add android
          npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ListaDeCompras-APK
          path: android/app/build/outputs/apk/debug/*.apk