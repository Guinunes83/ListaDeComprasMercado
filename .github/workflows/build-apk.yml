name: Build APK from Web App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare Project and Build Web Assets
        run: |
          # Se existir package.json em alguma subpasta, entra nela e faz o build
          PKG_PATH=$(find . -maxdepth 3 -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          
          if [ -n "$PKG_PATH" ]; then
            DIR=$(dirname "$PKG_PATH")
            echo "Encontrado package.json no diretório: $DIR"
            cd "$DIR"
            npm install
            npm run build --if-present
            cd "$GITHUB_WORKSPACE"
          else
            echo "Nenhum package.json encontrado. Criando ambiente padrão..."
            npm init -y
          fi

      - name: Setup Android Wrapper (Capacitor)
        run: |
          # Identifica onde estão os arquivos HTML/JS finais
          if [ -d "dist" ]; then
            WEB_DIR="dist"
          elif [ -d "build" ]; then
            WEB_DIR="build"
          elif [ -d "public" ]; then
            WEB_DIR="public"
          elif [ -f "index.html" ]; then
            WEB_DIR="."
          else
            # Procura a pasta que contém o index.html
            HTML_PATH=$(find . -maxdepth 3 -name "index.html" -not -path "*/node_modules/*" -not -path "*/.github/*" | head -n 1)
            if [ -n "$HTML_PATH" ]; then
              WEB_DIR=$(dirname "$HTML_PATH")
            else
              WEB_DIR="."
            fi
          fi
          
          echo "Utilizando diretório web: $WEB_DIR"

          # Inicializa o Capacitor na raiz
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "ListaDeCompras" "com.app.listadecompras" --web-dir "$WEB_DIR"
          npx cap add android
          npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ListaDeCompras-APK
          path: android/app/build/outputs/apk/debug/*.apk
